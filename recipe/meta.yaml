{% set name = "fastapi-mvc" %}
{% set version = "0.29.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: f7c53ef28d1c8931519b965444c36f942dfd8301305c82c1af58b803aa7ff7cd

build:
  number: 0
  noarch: python
  entry_points:
    - fastapi-mvc = fastapi_mvc.cli.cli:cli
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python {{ python_min }}
  run:
    - click >=8.1.3,<8.2.0
    - copier ==6.2.0
    - python >={{ python_min }},<4.0

test:
  imports:
    - fastapi_mvc
  commands:
    - pip check
    - fastapi-mvc --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/rszamszur/fastapi-mvc
  doc_url: https://fastapi-mvc.netlify.app/
  summary: Generate and manage FastAPI projects
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
